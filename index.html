<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería de personajes de Rick and Morty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1f2229; }
    .card-personaje { background: #2e3038; border: 0; overflow: hidden; }
    .card-personaje img { aspect-ratio: 1 / 1; object-fit: cover; background: #3b3e48; }
    .punto { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .4rem; }
    .punto.alive { background: #3ecf5a; }
    .punto.dead { background: #e5484d; }
    .punto.unknown { background: #8b8f99; }
    .etiqueta { color: #8b8f99; font-size: .8rem; }
    .modal-img { width: 100%; border-radius: .5rem; }
  </style>
</head>
<body>
  <main class="container py-4">
    <h1 class="h3 text-center mb-4">Personajes de Rick and Morty</h1>

    <div id="mensaje"></div>
    <div id="galeria" class="row g-3 row-cols-1 row-cols-md-2 row-cols-lg-4"></div>

    <nav class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button id="btnAnterior" class="btn btn-secondary btn-sm">&laquo; Anterior</button>
      <span id="paginaTexto" class="small">Página 1 de 42</span>
      <button id="btnSiguiente" class="btn btn-primary btn-sm">Siguiente &raquo;</button>
    </nav>
  </main>

  <!-- Ventana Detalle -->
  <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="modalTitulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-4">
            <div class="col-md-5"><img id="modalImagen" class="modal-img" alt=""></div>
            <div class="col-md-7">
              <table class="table table-sm mb-0">
                <tbody id="modalDatos"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="ricky.js"></script>
</body>
</html>
